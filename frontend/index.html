<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梦女站 Dream Girl</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Mobile Header -->
        <header id="mobile-header">
            <button id="menu-toggle" aria-label="菜单">☰</button>
            <h1 id="page-title">梦女站</h1>
            <div style="width:36px"></div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar" class="closed">
            <div class="sidebar-header">
                <span class="sidebar-logo">🌸 梦女站</span>
                <button id="sidebar-close" aria-label="关闭">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#/" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">🏠</span> 首页
                </a>
                <a href="#/characters" class="nav-item" data-page="characters">
                    <span class="nav-icon">👤</span> 角色管理
                </a>
                <a href="#/worldbooks" class="nav-item" data-page="worldbooks">
                    <span class="nav-icon">📖</span> 世界书
                </a>
                <a href="#/llm" class="nav-item" data-page="llm">
                    <span class="nav-icon">🤖</span> 大模型设置
                </a>
                <a href="#/chat" class="nav-item" data-page="chat">
                    <span class="nav-icon">💬</span> 聊天
                </a>
            </nav>
            <div class="sidebar-footer">
                <span>v1.0.0</span>
            </div>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div id="sidebar-overlay" class="closed"></div>

        <!-- Main Content -->
        <main id="main-content">
            <div id="page-container"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden"></div>
    <div id="modal-container" class="hidden">
        <div class="modal-header">
            <h3 id="modal-title"></h3>
            <button class="modal-close">✕</button>
        </div>
        <div id="modal-body"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/characters.js"></script>
    <script src="/js/worldbooks.js"></script>
    <script src="/js/llm.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
