services:
  - type: web
    name: sanmeng-dream
    runtime: python
    repo: https://github.com/witedream/sanmeng-dream
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sanmeng-db
          property: connectionString

databases:
  - name: sanmeng-db
    plan: free
    region: singapore
